name: Check New Sources v2

on:
  schedule:
    # Every day at 10:00 CST (02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 依赖级冒烟检查：selectolax 1.x 移除了 Modest 后端，曾导致
      # search_engine / check_promo_pages 在 import 阶段静默崩溃 18 天。
      # 这里直接验证用到的后端与最小解析能力，坏掉当天就红。
      - name: Smoke-check parser backend
        run: |
          python - <<'PY'
          import selectolax
          from selectolax.lexbor import LexborHTMLParser as P
          t = P('<html><body><div class="r"><a href="https://x.com">hi</a></div></body></html>')
          assert t.css("div.r")[0].css_first("a").attributes.get("href") == "https://x.com"
          assert t.css_first("a").text() == "hi"
          print(f"selectolax {selectolax.__version__} / lexbor backend OK")
          PY

      - name: Run v2 multi-source scanner
        id: check
        continue-on-error: true
        run: |
          python scripts/v2/check_sources_v2.py --output data/last_scan_v2.json 2>&1 | tee /tmp/check-v2-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Run LLM extraction v2 (if candidates found)
        id: extract
        if: steps.check.outputs.exit_code == '1'
        continue-on-error: true
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_PROVIDERS: ${{ secrets.LLM_PROVIDERS }}
        run: |
          python -c "
          import json
          report = json.load(open('data/last_scan_v2.json'))
          candidates = report.get('new_candidates', [])
          json.dump(candidates, open('/tmp/candidates_v2.json', 'w'), ensure_ascii=False)
          print(f'{len(candidates)} candidates to process')
          "
          if [ -s /tmp/candidates_v2.json ]; then
            python scripts/v2/extract_with_llm_v2.py < /tmp/candidates_v2.json > /tmp/extracted_v2.json \
              || echo "::error::LLM 抽取失败：请在仓库 Secrets 配置 LLM_API_KEY/LLM_BASE_URL（推荐美团 LongCat：https://api.longcat.chat/openai/v1 + LongCat-2.0，每天免费 10 万 Token）"
          fi

      - name: Auto PR for high-confidence candidates
        if: steps.check.outputs.exit_code == '1'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/extracted_v2.json ]; then
            python scripts/v2/auto_pr_v2.py < /tmp/extracted_v2.json \
              || echo "::error::自动 PR 创建失败：请到仓库 Settings → Actions → General → Workflow permissions 勾选 Allow GitHub Actions to create and approve pull requests"
          fi

      - name: Create issue for low-confidence candidates
        if: steps.check.outputs.exit_code == '1'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/extracted_v2.json ]; then
            python scripts/v2/create_issue_v2.py < /tmp/extracted_v2.json
          fi

      - name: Run v2 expiry check (daily)
        id: expiry
        continue-on-error: true
        run: |
          python scripts/v2/check_expiry_v2.py 2>&1 | tee /tmp/expiry-v2-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Create issue for v2 expiry problems
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/v2/create_expiry_issue_v2.py

      - name: Check official promo pages (diff + issue)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 退出码约定：0=无变化 1=有变更（正常） 2=运行错误（必须红）
          # 注意不能给本步加 continue-on-error，否则 2 会被吞掉导致静默停摆
          set +e
          python scripts/v2/check_promo_pages.py 2>&1 | tee /tmp/promo-v2-output.txt
          code=${PIPESTATUS[0]}
          echo "promo check exit=${code}（0=无变化 1=有变更 2=运行错误）"
          if [ "$code" -eq 2 ]; then
            echo "::error::官方活动页监控运行失败，快照未更新，请查看上方日志"
            exit 1
          fi
          exit 0

      - name: Commit promo snapshots if changed
        if: always()
        run: |
          # build.yml 的重建任务也在往 main 推（chore: rebuild site），本步直接
          # push 必然偶发 "! [rejected] main -> main (fetch first)"。推送被拒
          # 快照就不落地，下一轮会再次报告同一变更 —— 历史上大量重复 Issue 的成因。
          # 改为 rebase + 有限重试，并让最终失败显性化（不再 continue-on-error）。
          git checkout main 2>/dev/null || git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain data/promo_snapshots.json)" ]; then
            echo "快照无变化，跳过提交"
            exit 0
          fi
          git add data/promo_snapshots.json
          git commit -m "chore(promo): update page snapshots [skip ci]"
          for i in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push origin main; then
              echo "快照已提交（第 ${i} 次尝试成功）"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "第 ${i} 次推送失败，5s 后重试"
            sleep 5
          done
          echo "::error::活动页快照提交失败，基线未更新"
          exit 1

      - name: Upload v2 scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report-v2
          path: |
            data/last_scan_v2.json
            data/expiry_report_v2.json
          retention-days: 30
